<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betway - Win Big Today!</title>
    <style>
        /* General Styling */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            text-align: center;
            color: white;
        }

        nav {
            background-color: #00a826;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .hero {
            background-image: url('https://source.unsplash.com/1600x900/?sports,stadium');
            height: 400px;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-shadow: 2px 2px 5px black;
        }

        .hero h1 {
            font-size: 50px;
            margin: 0;
        }

        .hero p {
            font-size: 22px;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 20px;
            font-size: 20px;
            color: white;
            background-color: #00a826;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #00771e;
            transform: scale(1.1);
            box-shadow: 0 0 15px #00ff00;
        }

        /* Flashing Jackpot */
        @keyframes blink {
            0% { color: yellow; }
            50% { color: red; }
            100% { color: yellow; }
        }

        .jackpot {
            font-size: 30px;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        /* Countdown Timer */
        .countdown {
            font-size: 24px;
            margin-top: 10px;
            font-weight: bold;
            color: orange;
        }

        /* Login Form Styling */
        #contact {
            margin-top: 30px;
            background-color: #121212;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0px 0px 10px rgba(0, 255, 0, 0.5);
            text-align: center;
        }

        #contact h2 {
            color: #00ff00;
            font-size: 24px;
            margin-bottom: 15px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        /* Input Field Styling */
        input[type="text"], input[type="password"] {
            background-color: #222;
            color: white;
            border: 2px solid #00ff00;
            box-shadow: inset 0 0 5px rgba(0, 255, 0, 0.5);
            transition: all 0.3s ease-in-out;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
        }

        form button {
            width: 95%;
            padding: 12px;
            margin-top: 10px;
            background-color: #00a826;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        form button:hover {
            background-color: #00771e;
            box-shadow: 0 0 15px #00ff00;
        }

        footer {
            margin-top: 20px;
            padding: 15px;
            background-color: #1a1a1a;
            color: white;
        }

        /* Background Sound */
        #crowd-cheering {
            display: none;
        }

    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#promotions">Promotions</a>
        <a href="#countdown">Live Promo Countdown</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="hero" id="home">
        <h1>Welcome to Betway</h1>
        <p>Your #1 Destination for Online Sports Betting</p>
        <p class="jackpot">💰 JACKPOT: $50,000 💰</p>
        <a href="#" class="button" onclick="startConfetti(); playSound();">Join Now</a>
    </div>

    <!-- Countdown Timer -->
    <div id="countdown">
        <h2>🎉 Next Big Promo Starts In:</h2>
        <p class="countdown" id="timer">Loading...</p>
    </div>

    <!-- Contact Section -->
    <div id="contact">
        <h2>📩 Login to Your Account</h2>
        <form>
            <input type="text" placeholder="Enter Mobile Number" required><br>
            <input type="password" placeholder="Enter Your Password" required><br>
            <button type="submit">LOGIN</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Betway. All rights reserved. Gamble responsibly.</p>
    </footer>

    <audio id="crowd-cheering" src="https://www.soundjay.com/human/cheering-crowd.mp3"></audio>

    <script>
        // Confetti Effect
        function startConfetti() {
            let count = 100;
            let duration = 3000; // Confetti lasts for 3s
            for (let i = 0; i < count; i++) {
                let confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.style.left = Math.random() * window.innerWidth + "px";
                confetti.style.animationDuration = Math.random() * 2 + 1 + "s";
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), duration);
            }
        }

        // Play Crowd Cheering Sound
        function playSound() {
            let sound = document.getElementById("crowd-cheering");
            sound.play();
        }

        // Countdown Timer
        function startCountdown(duration) {
            let timer = document.getElementById("timer");
            let timeLeft = duration;

            let countdownInterval = setInterval(() => {
                if (timeLeft < 0) {
                    timer.innerHTML = "🚀 Promo Started!";
                    clearInterval(countdownInterval);
                    return;
                }

                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timer.innerHTML = `${minutes}m ${seconds}s`;
                timeLeft--;
            }, 1000);
        }

        startCountdown(300); // 5-minute countdown
    </script>

  </html>
